<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>✈ 비행기방</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F0F4FF; --surface:#fff; --border:#DDEAFF;
  --text:#111827; --text2:#6B7280; --text3:#B0BBCF;
  --primary:#1A6BFF; --primary-dark:#0052D4;
  --grad:linear-gradient(135deg,#1A6BFF 0%,#0EA5E9 50%,#38BDF8 100%);
  --grad2:linear-gradient(135deg,#6366F1 0%,#1A6BFF 50%,#0EA5E9 100%);
  --green:#059669; --green-bg:#ECFDF5;
  --amber:#D97706; --amber-bg:#FFFBEB;
  --red:#DC2626;   --red-bg:#FEF2F2;
  --radius:16px; --radius-sm:10px;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; }
body{
  font-family:'Pretendard',-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5;
  max-width:430px; margin:0 auto; position:relative;
}

/* 페이지 */
.page{ display:none; height:100vh; flex-direction:column; overflow:hidden; }
.page.active{ display:flex; }

/* 탑바 */
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50; flex-shrink:0;
}
.topbar-logo{ font-size:20px; font-weight:800; letter-spacing:-0.5px; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.topbar-right{ display:flex; align-items:center; gap:8px; }
.topbar-user{ font-size:13px; font-weight:600; color:var(--text2); }

/* 버튼 */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font-family:inherit; font-size:14px; font-weight:600;
  padding:10px 20px; border-radius:var(--radius-sm);
  border:none; cursor:pointer; transition:all .15s; width:100%;
}
.btn:active{ transform:scale(0.97); }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.btn-primary{ background:var(--primary); color:#fff; }
.btn-primary:hover{ background:var(--primary-dark); }
.btn-grad{ background:var(--grad); color:#fff; }
.btn-outline{ background:transparent; color:var(--text); border:1px solid var(--border); }
.btn-green{ background:var(--green); color:#fff; }
.btn-sm{ padding:6px 14px; font-size:12px; width:auto; border-radius:6px; }
.btn-xs{ padding:4px 10px; font-size:11px; width:auto; border-radius:5px; font-weight:700; }

/* 입력 */
.field{ margin-bottom:14px; }
.field:last-child{ margin-bottom:0; }
.field-label{ font-size:12px; font-weight:700; color:var(--text2); margin-bottom:5px; display:block; }
.input{
  width:100%; padding:11px 14px;
  border:1.5px solid var(--border); border-radius:var(--radius-sm);
  font-size:14px; font-family:inherit;
  background:var(--surface); color:var(--text);
  outline:none; transition:border-color .15s;
}
.input:focus{ border-color:var(--text2); }
.input::placeholder{ color:var(--text3); }

/* 배지 */
.badge{ display:inline-flex; align-items:center; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap; }
.badge-green { background:var(--green-bg); color:var(--green); }
.badge-amber { background:var(--amber-bg); color:var(--amber); }
.badge-red   { background:var(--red-bg);   color:var(--red); }
.badge-blue  { background:#EFF9FF;          color:var(--primary); }
.badge-gray  { background:#F5F5F5;          color:var(--text2); }

/* 태그 */
.tag{ display:inline-flex; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; background:#F0F0F0; color:var(--text2); margin:2px; }

/* 배너 */
.banner{ padding:12px 14px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:14px; display:none; }
.banner.show{ display:block; }
.banner-warn { background:var(--amber-bg); color:var(--amber); border:1px solid #FFD580; }
.banner-error{ background:var(--red-bg);   color:var(--red);   border:1px solid #F7C5CA; }
.banner-ok   { background:var(--green-bg); color:var(--green); border:1px solid #A3E4C9; }

/* 스피너 */
.spinner{ width:18px; height:18px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; display:inline-block; }
.spinner-dark{ border-color:var(--border); border-top-color:var(--primary); }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* 카드 */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:12px; }
.card-body{ padding:16px; }

/* 룸 카드 */
.room-card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px;
  margin-bottom:10px; cursor:pointer; transition:all .15s;
  position:relative; overflow:hidden;
}
.room-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--grad2); }
.room-card:active{ transform:scale(0.98); background:var(--bg); }
.room-card-title{ font-size:15px; font-weight:700; margin-bottom:4px; }
.room-card-meta{ font-size:12px; color:var(--text2); margin-bottom:8px; }


/* 참여자 목록 */
.p-list{ overflow-y:visible; }
.p-row{ display:flex; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); }
.p-row:last-child{ border-bottom:none; }
.avatar{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; background:var(--grad); color:#fff; }
.p-info{ flex:1; margin-left:10px; }
.p-name{ font-size:13px; font-weight:600; }
.p-insta{ font-size:11px; color:var(--text3); }

/* 내 참여 섹션 */
.my-section{ border-top:1px solid var(--border); padding:16px; background:var(--surface); flex-shrink:0; }
.my-label{ font-size:11px; font-weight:700; color:var(--text3); letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; }
.my-block{ border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:8px; }
.my-block:last-child{ margin-bottom:0; }
.my-row{ padding:12px 14px; display:flex; align-items:flex-start; justify-content:space-between; border-bottom:1px solid var(--border); }
.my-row:last-child{ border-bottom:none; }
.my-row-label{ font-size:13px; font-weight:600; margin-bottom:2px; }
.my-row-sub{ font-size:11px; color:var(--text3); }
.link-box{ font-size:12px; color:var(--primary); word-break:break-all; padding:8px 10px; background:#EFF9FF; border-radius:6px; margin-top:6px; }

/* 참여자 헤더 카운트 */
.count-chip{
  display:inline-flex; align-items:center; gap:4px;
  font-size:11px; font-weight:700; padding:3px 8px;
  border-radius:20px; margin-left:5px;
}
.count-chip-total{ background:#F0F0F0; color:var(--text2); }
.count-chip-land { background:var(--green-bg); color:var(--green); }

/* 빈 상태 */
.empty{ text-align:center; padding:48px 20px; color:var(--text3); font-size:13px; }

/* 경고 탑배너 */
.warn-top{ background:var(--amber-bg); border-bottom:1px solid #FFD580; padding:10px 16px; font-size:12px; color:var(--amber); font-weight:600; display:none; flex-shrink:0; }
.warn-top.show{ display:block; }

/* 콘텐츠 */
.content{ flex:1; padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; }

/* ── 로그인 ── */
.login-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; }
.login-logo-wrap{ text-align:center; margin-bottom:32px; }
.plane-anim{ font-size:56px; display:block; animation:flyPlane 3s ease-in-out infinite; margin-bottom:12px; }
@keyframes flyPlane{
  0%  { transform:translateX(-8px) rotate(-5deg); }
  50% { transform:translateX(8px)  rotate(5deg); }
  100%{ transform:translateX(-8px) rotate(-5deg); }
}
.login-title{ font-size:28px; font-weight:800; letter-spacing:-1px; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.login-sub{ font-size:13px; color:var(--text2); margin-top:4px; }
.login-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; width:100%; max-width:360px; }
.login-note{ font-size:12px; color:var(--text3); text-align:center; margin-top:14px; }

/* 구름 */
.clouds{ position:fixed; top:0; left:0; right:0; height:100vh; pointer-events:none; z-index:0; overflow:hidden; }
.cloud{ position:absolute; font-size:40px; opacity:0.08; animation:floatCloud linear infinite; }
.cloud:nth-child(1){ top:10%; animation-duration:20s; animation-delay:0s;   font-size:50px; }
.cloud:nth-child(2){ top:30%; animation-duration:25s; animation-delay:-8s;  font-size:35px; }
.cloud:nth-child(3){ top:60%; animation-duration:18s; animation-delay:-4s;  font-size:45px; }
.cloud:nth-child(4){ top:80%; animation-duration:22s; animation-delay:-12s; font-size:30px; }
@keyframes floatCloud{ from{ transform:translateX(-100px); } to{ transform:translateX(calc(100vw + 100px)); } }

/* 비행기 날기 */
.fly-plane{ position:fixed; top:30%; left:-80px; font-size:40px; z-index:999; animation:flyAcross 1.2s ease-in-out forwards; pointer-events:none; display:none; }
@keyframes flyAcross{
  from{ left:-80px; top:30%; opacity:1; }
  to  { left:calc(100vw + 80px); top:10%; opacity:0.5; }
}
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
.fade-up{ animation:fadeUp .25s ease both; }
</style>
</head>
<body>

<div class="clouds">
  <div class="cloud">☁️</div><div class="cloud">☁️</div>
  <div class="cloud">☁️</div><div class="cloud">☁️</div>
</div>
<div class="fly-plane" id="fly-plane">✈️</div>

<!-- ══ 로그인 ══ -->
<div class="page active" id="page-login">
  <div class="login-wrap">
    <div class="login-logo-wrap">
      <span class="plane-anim">✈️</span>
      <div class="login-title">비행기방</div>
      <div class="login-sub">@jjoycrew_official</div>
    </div>
    <div class="login-card">
      <div id="login-warn"  class="banner banner-warn">⚠️ 경고 상태입니다. 익일 09:00까지 해제하지 않으면 잠깁니다.</div>
      <div id="login-error" class="banner banner-error"></div>
      <div class="field">
        <label class="field-label">닉네임</label>
        <input class="input" id="inp-nickname" placeholder="닉네임 입력" autocomplete="off">
      </div>
      <div class="field">
        <label class="field-label">인스타 아이디 (@ 제외)</label>
        <input class="input" id="inp-insta" placeholder="instagram_id" autocomplete="off" autocapitalize="none">
      </div>
      <button class="btn btn-grad" id="btn-login">입장하기 ✈</button>
    </div>
    <p class="login-note">계정 등록은 관리자에게 문의하세요</p>
  </div>
</div>

<!-- ══ 룸 목록 ══ -->
<div class="page" id="page-rooms">
  <div class="topbar">
    <div class="topbar-logo">✈ 비행기방</div>
    <div class="topbar-right">
      <span id="rooms-user-badge" class="topbar-user"></span>
      <button class="btn btn-outline btn-sm" id="btn-logout">로그아웃</button>
    </div>
  </div>
  <div id="warn-top-rooms" class="warn-top"></div>
  <div id="ticket-info-bar" style="padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-direction:column;gap:4px;flex-shrink:0"></div>
  <div class="content">
    <div id="rooms-error" class="banner banner-error"></div>
    <div id="rooms-list">
      <div class="empty"><span class="spinner spinner-dark" style="width:24px;height:24px"></span></div>
    </div>
  </div>
</div>

<!-- ══ 티켓 화면 ══ -->
<div class="page" id="page-ticket">
  <div class="topbar">
    <button class="btn btn-outline btn-sm" style="width:auto" id="btn-back">← 목록</button>
    <div id="ticket-title" style="font-size:15px;font-weight:700"></div>
    <span id="ticket-badge" class="badge"></span>
  </div>
  <div id="warn-top-ticket" class="warn-top"></div>

  <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch">
    <!-- 룸 정보 -->
    <div style="padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)">
      <div id="ticket-time" style="font-size:12px;color:var(--text2);margin-bottom:6px"></div>
      <div id="ticket-items" style="margin-bottom:8px"></div>
      <div id="ticket-memo" style="font-size:12px;color:var(--text2);white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;display:none;line-height:1.7"></div>
    </div>

    <!-- 참여자 헤더 -->
    <div style="padding:9px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px">
        <span id="p-count" style="font-size:12px;font-weight:700;color:var(--text2)">참여자 목록</span>
        <!-- 착륙 중일 때 인원 뱃지 동적 추가 -->
        <span id="p-land-badge" style="display:none"></span>
      </div>
      <button class="btn btn-outline btn-sm" id="btn-copy-all">전체 복사</button>
    </div>

    <!-- 참여자 목록 -->
    <div class="p-list" id="p-list" style="background:var(--surface)">
      <div class="empty" style="padding:20px"><span class="spinner spinner-dark" style="width:20px;height:20px"></span></div>
    </div>

    <!-- 내 참여 -->
    <div class="my-section">
      <div class="my-label">내 참여</div>
      <div id="my-part"></div>
    </div>
  </div>
</div>

<script>
// =====================================================================
// 상수 / 전역 상태
// =====================================================================
const API         = 'https://script.google.com/macros/s/AKfycbyAy0HHa-4c_ouX_Wion6ZvEmyEu7XbuUaKHg-2F55jhvzkZd0uBVPokihZH_MgnNY/exec';
const SESSION_KEY = 'plane_crew_session';

let me           = null;
let currentRoom  = null;
let participants = [];
let weekLandCount= 0;

// iOS 키보드 스크롤 대응
if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
  window.addEventListener('focusin', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
      setTimeout(() => e.target.scrollIntoView({ behavior:'smooth', block:'center' }), 400);
    }
  });
}

// =====================================================================
// 세션
// =====================================================================
function saveSession(m)  { try { if (m?.member_id) sessionStorage.setItem(SESSION_KEY, JSON.stringify(m)); } catch(e){} }
function loadSession()   { try { const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)); return (s?.member_id) ? s : null; } catch(e){ return null; } }
function clearSession()  { try { sessionStorage.removeItem(SESSION_KEY); sessionStorage.clear(); } catch(e){} }

// =====================================================================
// API
// =====================================================================
const SILENT = new Set(['get_rooms','get_all_rooms','get_room_detail','get_daily','get_members','get_logs','get_weekly','get_warnings','get_my_week_count','get_presets']);
let _lc = 0;
function showLoading(msg){ _lc++; const el=document.getElementById('g-loading'); if(el){ el.style.display='flex'; document.getElementById('g-loading-msg').textContent=msg||'처리 중...'; } }
function hideLoading()   { _lc=Math.max(0,_lc-1); if(_lc===0){ const el=document.getElementById('g-loading'); if(el) el.style.display='none'; } }

async function api(action, body={}) {
  const silent = SILENT.has(action);
  if (!silent) showLoading();
  try {
    const r = await fetch(API, { method:'POST', body: JSON.stringify(Object.assign({}, body, {action})) });
    return r.json();
  } finally {
    if (!silent) hideLoading();
  }
}

// =====================================================================
// 유틸
// =====================================================================
function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
function showBanner(id,msg,type='error'){ const el=document.getElementById(id); if(el){ el.className=`banner banner-${type} show`; el.textContent=msg; } }
function hideBanner(id){ document.getElementById(id)?.classList.remove('show'); }
function letter(n){ return n ? n.charAt(0) : '?'; }

function parseKST(str) {
  if (!str) return new Date(0);
  const s = String(str).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
  return m ? new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:00+09:00`) : new Date(s);
}
function fmt(s) {
  if (!s || s==='-') return '-';
  const str = String(s);
  if (/^\d{1,2}\/\d{1,2} \d{2}:\d{2}$/.test(str)) return str;
  try {
    const d = new Date(str.replace(' ','T') + ':00+09:00');
    if (isNaN(d.getTime())) return str.substring(0,16);
    return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  } catch(e){ return str.substring(0,16); }
}

function flyEffect(){ const el=document.getElementById('fly-plane'); el.style.display='block'; setTimeout(()=>el.style.display='none', 1300); }

function getExcellentExpiry(grantedAt) {
  try {
    const d = grantedAt ? new Date(String(grantedAt).substring(0,10)+'T00:00:00+09:00') : new Date();
    d.setDate(d.getDate()+1);
    return `${d.getMonth()+1}/${d.getDate()} 10:00`;
  } catch(e){ return '내일 10:00'; }
}
function getHonoraryExpiry(grantedAt) {
  try {
    const base = grantedAt ? new Date(String(grantedAt).substring(0,10)+'T00:00:00+09:00') : new Date();
    const day  = base.getDay();
    const sun  = new Date(base);
    sun.setDate(base.getDate() + (day===0 ? 0 : 7-day));
    return `${sun.getMonth()+1}/${sun.getDate()} 22:00`;
  } catch(e){ return '일요일 22:00'; }
}

// =====================================================================
// 이벤트 바인딩 (인라인 onclick 완전 제거)
// =====================================================================
document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('btn-logout').addEventListener('click', doLogout);
document.getElementById('btn-back').addEventListener('click', goRooms);
document.getElementById('btn-copy-all').addEventListener('click', copyAll);
['inp-nickname','inp-insta'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); })
);
// 내 참여 섹션 — 이벤트 위임으로 버튼 처리
document.getElementById('my-part').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  if (a==='land')        doLand(btn);
  if (a==='link-reg')    doRegisterLink(btn);
  if (a==='link-edit')   doUpdateLink(btn);
  if (a==='staff')       doTicketDirect('staff');
  if (a==='ticket')      doTicketFromUI();
});

// =====================================================================
// 초기 로드
// =====================================================================
window.addEventListener('load', () => {
  const saved = loadSession();
  if (saved?.member_id) { me = saved; goRooms(); }
  else clearSession();
});

// =====================================================================
// 로그인 / 로그아웃
// =====================================================================
async function doLogin() {
  const nickname = document.getElementById('inp-nickname').value.trim();
  const insta_id = document.getElementById('inp-insta').value.trim();
  hideBanner('login-error'); hideBanner('login-warn');
  if (!nickname || !insta_id) { showBanner('login-error','닉네임과 인스타 아이디를 모두 입력해 주세요'); return; }
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const data = await api('login', {nickname, insta_id});
    if (!data.ok) { showBanner('login-error', data.error==='locked' ? '🔒 '+data.message : data.error||'등록되지 않은 계정입니다'); return; }
    clearSession();
    me = data.member;
    if (!me.member_id) { showBanner('login-error','계정 정보 오류. 관리자에게 문의하세요.'); return; }
    saveSession(me);
    if (me.is_warned) document.getElementById('login-warn').classList.add('show');
    flyEffect();
    setTimeout(goRooms, 400);
  } catch(e) { showBanner('login-error','서버 연결에 실패했습니다'); }
  finally { btn.disabled=false; btn.innerHTML='입장하기 ✈'; }
}

function doLogout() {
  me=null; currentRoom=null; participants=[];
  clearSession(); showPage('page-login');
}

// =====================================================================
// 룸 목록
// =====================================================================
async function goRooms() {
  showPage('page-rooms');
  document.getElementById('rooms-user-badge').textContent = me ? `@${me.insta_id}` : '';

  // 경고 배너
  const warnBanner = document.getElementById('warn-top-rooms');
  if (me?.is_warned) {
    warnBanner.className = 'warn-top show';
    warnBanner.innerHTML = `⚠️ 경고 ${me.warning_count||1}회 보유 중 · 만료: ${me.warn_expires||'익일 10:00'} · 경고 보유 시 탑승 불가`;
  } else {
    warnBanner.className = 'warn-top';
    warnBanner.innerHTML = '';
  }

  // 우수/명예 안내바
  const infoBar = document.getElementById('ticket-info-bar');
  const infos = [];
  if (me?.excellent_count > 0) infos.push(`<div style="font-size:12px;color:var(--primary);padding:4px 0">⭐ 우수 티켓 ${me.excellent_count}개 보유 · 만료: ${getExcellentExpiry(me.excellent_granted_at)}까지</div>`);
  if (me?.honorary_count  > 0) infos.push(`<div style="font-size:12px;color:#7C3AED;padding:4px 0">🏅 명예 티켓 ${me.honorary_count}개 보유 · 만료: ${getHonoraryExpiry(me.honorary_granted_at)}까지</div>`);
  if (infos.length) {
    infoBar.style.display = 'flex'; infoBar.style.padding = '6px 16px';
    infoBar.innerHTML = infos.join('');
  } else { infoBar.style.display = 'none'; infoBar.innerHTML = ''; }

  hideBanner('rooms-error');
  document.getElementById('rooms-list').innerHTML = '<div class="empty"><span class="spinner spinner-dark" style="width:24px;height:24px"></span></div>';
  try {
    const data = await api('get_rooms');
    renderRooms(data.rooms || []);
  } catch(e) {
    showBanner('rooms-error','룸 목록을 불러오지 못했습니다');
    document.getElementById('rooms-list').innerHTML = '';
  }
}

const GRAD_COLORS = [
  ['#1A6BFF','#0EA5E9'],['#6366F1','#1A6BFF'],['#0EA5E9','#38BDF8'],
  ['#3B82F6','#6366F1'],['#0052D4','#1A6BFF'],['#1A6BFF','#38BDF8'],
];

function renderRooms(rooms) {
  const el = document.getElementById('rooms-list');
  const isWarned = !!(me?.is_warned);
  if (!rooms.length) {
    el.innerHTML = `<div class="empty fade-up"><div style="font-size:40px;margin-bottom:12px">✈️</div>오늘 개설된 비행기가 없습니다<br><span style="font-size:12px;margin-top:6px;display:block">잠시 후 다시 확인해 주세요</span></div>`;
    return;
  }
  const now = new Date();
  el.innerHTML = rooms.map(r => {
    const ts = parseKST(r.ticket_start), te = parseKST(r.ticket_end);
    const ls = parseKST(r.land_start),   le = parseKST(r.land_end);
    const beforeTicket = now < ts;
    const inTicketing  = now >= ts && now < te;
    const waitingLand  = now >= te && now < ls;
    const inLanding    = now >= ls && now < le;

    let badge, canEnter;
    if      (beforeTicket) { badge='<span class="badge badge-gray">입장 대기 ⏳</span>';  canEnter=false; }
    else if (inTicketing)  { badge='<span class="badge badge-green">🎫 티켓팅 중</span>'; canEnter=true; }
    else if (waitingLand)  { badge='<span class="badge badge-amber">착륙 대기 ⏳</span>'; canEnter=true; }
    else if (inLanding)    { badge='<span class="badge badge-blue">🛬 착륙 중</span>';    canEnter=true; }
    else                   { badge='<span class="badge badge-red">🔒 착륙 마감</span>';   canEnter=false; }

    if (isWarned && canEnter) canEnter = false;

    const tags     = (r.items||'').split(',').map(t=>`<span class="tag">${t.trim()}</span>`).join('');
    const maxLabel = Number(r.max_members) >= 9999 ? '무제한' : r.max_members;
    const joined   = r.joined || 0;
    const landed   = r.landed_count ?? null;

    // 인원 표시: 착륙 중/대기 → "착륙완료 N명 / 탑승 N명", 그 외 → "N명 / 정원"
    let countLine;
    if (inLanding || waitingLand) {
      const landedStr = landed !== null
        ? `<span style="color:var(--green);font-weight:800">착륙완료 ${landed}명</span> / 탑승 ${joined}명`
        : `탑승 ${joined}명`;
      countLine = `<div style="margin-top:8px;font-size:13px;font-weight:700">${landedStr}</div>`;
    } else {
      countLine = '';
    }

    // 메타 인원 (착륙 중/대기가 아닐 때만)
    const joinedMeta = (!inLanding && !waitingLand)
      ? `&nbsp;&nbsp;👥 ${joined}/${maxLabel}명`
      : '';

    return `
      <div class="room-card" style="${!canEnter && !isWarned ? 'opacity:.6;cursor:not-allowed;' : isWarned ? 'opacity:.7;cursor:not-allowed;' : ''}" data-rid="${r.room_id}" data-enter="${canEnter}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px">
          <div class="room-card-title">${String(r.room_date).substring(0,10)} #${r.room_number}</div>
          ${badge}
        </div>
        <div class="room-card-meta" style="font-size:11px">
          🎫 ${r.ticket_start_fmt||fmt(r.ticket_start)} ~ ${r.ticket_end_fmt||fmt(r.ticket_end)}&nbsp;&nbsp;
          🛬 ${r.land_start_fmt||fmt(r.land_start)} ~ ${r.land_end_fmt||fmt(r.land_end)}${joinedMeta}
        </div>
        <div>${tags}</div>
        ${countLine}
        ${beforeTicket ? `<div style="font-size:11px;color:var(--text3);margin-top:6px">⏳ ${r.ticket_start_fmt||fmt(r.ticket_start)} 부터 입장 가능</div>` : ''}
        ${isWarned ? `<div style="font-size:11px;color:var(--red);margin-top:6px;font-weight:600">🚫 경고 보유 중 — 탑승 불가</div>` : ''}
      </div>`;
  }).join('');

  // 룸 목록 이벤트 위임
  el.addEventListener('click', e => {
    const card = e.target.closest('.room-card');
    if (!card) return;
    if (card.dataset.enter === 'true') goTicket(card.dataset.rid);
  }, { once: true }); // 매번 goRooms 호출 시 재등록되므로 once
  // once는 rerender마다 새로 붙여야 하므로 아래 방식으로 처리
}

// 룸 목록 클릭 위임 (전역)
document.getElementById('rooms-list').addEventListener('click', e => {
  const card = e.target.closest('.room-card');
  if (!card) return;
  if (card.dataset.enter === 'true') goTicket(card.dataset.rid);
});

// =====================================================================
// 티켓 화면
// =====================================================================
async function goTicket(roomId) {
  if (!me) me = loadSession();
  if (!me?.member_id) { alert('세션이 만료되었습니다. 다시 로그인해 주세요.'); clearSession(); me=null; showPage('page-login'); return; }

  // 초기화
  currentRoom = null; participants = [];
  ['ticket-title','ticket-time'].forEach(id => document.getElementById(id).textContent='');
  document.getElementById('ticket-badge').className = 'badge';
  document.getElementById('ticket-badge').textContent = '';
  document.getElementById('ticket-items').innerHTML = '';
  document.getElementById('ticket-memo').style.display = 'none';
  document.getElementById('p-count').textContent = '참여자 목록';
  document.getElementById('p-land-badge').style.display = 'none';
  document.getElementById('p-list').innerHTML = '<div class="empty" style="padding:20px"><span class="spinner spinner-dark" style="width:20px;height:20px"></span></div>';
  document.getElementById('my-part').innerHTML = '';

  showPage('page-ticket');
  document.getElementById('warn-top-ticket').innerHTML = me?.is_warned
    ? `⚠️ 경고 ${me.warning_count||1}회 보유 중 · 만료: ${me.warn_expires||'익일 10:00'}`
    : '';
  document.getElementById('warn-top-ticket').classList.toggle('show', !!me?.is_warned);

  // 주간 착륙 수 + 룸 상세 병렬 로드
  const [wcRes, detailRes] = await Promise.allSettled([
    api('get_my_week_count', {member_id: me.member_id}),
    api('get_room_detail',   {room_id: roomId, member_id: me.member_id}),
  ]);

  weekLandCount = wcRes.status==='fulfilled' && wcRes.value.ok ? (wcRes.value.week_land_count||0) : 0;

  if (detailRes.status==='rejected' || !detailRes.value.ok) {
    document.getElementById('p-list').innerHTML = '<div class="empty">불러오기 실패</div>';
    return;
  }

  const data = detailRes.value;
  currentRoom  = data.room;
  participants = data.participants || [];

  document.getElementById('ticket-title').textContent = `${String(currentRoom.room_date).substring(0,10)} #${currentRoom.room_number}`;

  const now          = new Date();
  const ticketStart  = parseKST(currentRoom.ticket_start);
  const ticketEnd    = parseKST(currentRoom.ticket_end);
  const landStart    = parseKST(currentRoom.land_start);
  const landEnd      = parseKST(currentRoom.land_end);
  const beforeTicket = now < ticketStart;
  const inTicketing  = now >= ticketStart && now < ticketEnd;
  const waitingLand  = now >= ticketEnd   && now < landStart;
  const inLanding    = now >= landStart   && now < landEnd;
  const afterAll     = now >= landEnd;

  const badge = document.getElementById('ticket-badge');
  if      (beforeTicket){ badge.className='badge badge-gray';  badge.textContent='입장 대기 ⏳'; }
  else if (inTicketing) { badge.className='badge badge-green'; badge.textContent='🎫 티켓팅 중'; }
  else if (waitingLand) { badge.className='badge badge-amber'; badge.textContent='착륙 대기 ⏳'; }
  else if (inLanding)   { badge.className='badge badge-blue';  badge.textContent='🛬 착륙 중'; }
  else                  { badge.className='badge badge-red';   badge.textContent='🔒 착륙 마감'; }

  document.getElementById('ticket-time').innerHTML =
    `<span style="color:var(--primary);font-weight:600">🎫 티켓팅</span> ${currentRoom.ticket_start_fmt||fmt(currentRoom.ticket_start)} ~ ${currentRoom.ticket_end_fmt||fmt(currentRoom.ticket_end)}&nbsp;&nbsp;` +
    `<span style="color:var(--green);font-weight:600">🛬 착륙</span> ${currentRoom.land_start_fmt||fmt(currentRoom.land_start)} ~ ${currentRoom.land_end_fmt||fmt(currentRoom.land_end)}`;

  document.getElementById('ticket-items').innerHTML = (currentRoom.items||'').split(',').map(t=>`<span class="tag">${t.trim()}</span>`).join('');

  const memoEl = document.getElementById('ticket-memo');
  if (currentRoom.memo) { memoEl.textContent=currentRoom.memo; memoEl.style.display='block'; }
  else memoEl.style.display='none';

  // ── 참여자 수 + 착륙 완료 수 표시
  const totalCount  = participants.length;
  const landedCount = participants.filter(p=>p.status==='landed').length;
  document.getElementById('p-count').textContent = `참여자 (${totalCount}명)`;

  // 착륙 중 또는 착륙 대기 시 착륙 완료 현황 뱃지 노출
  const landBadge = document.getElementById('p-land-badge');
  if (inLanding || waitingLand || afterAll) {
    landBadge.style.display = 'inline-flex';
    landBadge.innerHTML =
      `<span class="count-chip count-chip-total">전체 ${totalCount}</span>` +
      `<span class="count-chip count-chip-land">착륙 ${landedCount}/${totalCount}</span>`;
  } else {
    landBadge.style.display = 'none';
  }

  renderParticipants();
  renderMyPart(beforeTicket, inTicketing, waitingLand, inLanding, afterAll);
}

function renderParticipants() {
  const el = document.getElementById('p-list');
  if (!participants.length) { el.innerHTML='<div class="empty" style="padding:20px;font-size:12px">아직 참여자가 없습니다</div>'; return; }
  el.innerHTML = participants.map((p,i) => {
    const [c1,c2] = GRAD_COLORS[i % GRAD_COLORS.length];
    const isMe    = me && p.nickname===me.nickname && p.member_id===me.member_id;
    const sb      = p.status==='landed'
      ? '<span class="badge badge-green" style="font-size:10px">착륙 ✓</span>'
      : '<span class="badge badge-blue"  style="font-size:10px">탑승</span>';
    const ttBadge = p.ticket_type==='excellent'
      ? '<span class="badge" style="font-size:9px;background:#EFF9FF;color:var(--primary)">⭐우수</span>'
      : p.ticket_type==='honorary'
        ? '<span class="badge" style="font-size:9px;background:#F5F3FF;color:#7C3AED">🏅명예</span>' : '';
    return `
      <div class="p-row" style="${isMe?'background:#F0F7FF':''}">
        <div class="avatar" style="background:linear-gradient(135deg,${c1},${c2})">${letter(p.nickname)}</div>
        <div class="p-info" style="flex:1;margin-left:10px;min-width:0">
          <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
            <span class="p-name">${p.nickname}${isMe?` <span style="font-size:10px;color:var(--primary)">(나)</span>`:''}</span>
            ${sb}${ttBadge}
          </div>
          <div class="p-insta">@${p.insta_id}</div>
          ${p.post_url
            ? `<div style="margin-top:3px"><a href="${p.post_url}" target="_blank" style="font-size:11px;color:var(--primary);word-break:break-all;line-height:1.4">${p.post_url}</a></div>`
            : `<div style="font-size:11px;color:var(--text3);margin-top:2px">링크 미등록</div>`}
        </div>
      </div>`;
  }).join('');
}

// =====================================================================
// 내 참여 렌더 (data-action 방식, onclick 없음)
// =====================================================================
function renderMyPart(beforeTicket, inTicketing, waitingLand, inLanding, afterAll) {
  const el = document.getElementById('my-part');
  if (!me) return;
  const myPart = participants.find(p=>p.nickname===me.nickname && p.member_id===me.member_id)
              || participants.find(p=>p.nickname===me.nickname);

  // ── 착륙 완료
  if (myPart?.status==='landed') {
    el.innerHTML = `
      <div class="my-block">
        <div class="my-row" style="background:var(--green-bg)">
          <div><div class="my-row-label" style="color:var(--green)">✅ 착륙 완료</div>
          <div class="my-row-sub">참여가 정상 기록되었습니다 · ${myPart.landed_at||''}</div></div>
        </div>
        <div class="my-row">
          <div style="flex:1"><div class="my-row-label">🔗 내 링크</div>
            ${myPart.post_url ? `<div class="link-box">${myPart.post_url}</div>` : '<div class="my-row-sub" style="margin-top:4px">링크 미등록</div>'}
          </div>
        </div>
      </div>`;
    return;
  }

  // ── 착륙 마감 후
  if (afterAll) {
    el.innerHTML = `
      <div class="my-block">
        <div class="my-row" style="background:#FEF2F2">
          <div><div class="my-row-label" style="color:var(--red)">🔒 착륙 마감</div>
          ${myPart ? '<div class="my-row-sub" style="color:var(--red)">착륙하지 않아 경고가 부여될 수 있습니다</div>' : '<div class="my-row-sub">참여하지 않은 룸입니다</div>'}</div>
        </div>
        ${myPart?.post_url ? `<div class="my-row"><div style="flex:1"><div class="my-row-label">등록된 링크</div><div class="link-box">${myPart.post_url}</div></div></div>` : ''}
      </div>`;
    return;
  }

  // ── 탑승 완료 (ticketed)
  if (myPart?.status==='ticketed') {
    const hasLink = !!myPart.post_url;
    const linkSection = hasLink
      ? `<div class="link-box">${myPart.post_url}</div>
         ${inTicketing ? `<div style="margin-top:8px;display:flex;gap:6px">
           <input class="input" id="inp-link-edit" placeholder="새 링크로 수정..." style="flex:1;font-size:12px;padding:8px 10px" value="${myPart.post_url}">
           <button class="btn btn-outline btn-sm" data-action="link-edit">수정</button>
           </div><div class="my-row-sub" style="margin-top:4px">티켓팅 시간 내에만 수정 가능</div>` : ''}`
      : inTicketing
        ? `<div style="margin-top:8px;display:flex;gap:6px">
             <input class="input" id="inp-link" placeholder="https://instagram.com/p/..." style="flex:1;font-size:12px;padding:8px 10px">
             <button class="btn btn-primary btn-sm" data-action="link-reg">등록</button>
           </div><div class="my-row-sub" style="margin-top:4px">링크 등록 후 수정 가능</div>`
        : `<div class="my-row-sub" style="margin-top:4px;color:var(--amber)">⚠ 티켓팅 마감 — 링크 등록 불가</div>`;
    el.innerHTML = `
      <div class="my-block">
        <div class="my-row"><div style="flex:1"><div class="my-row-label">🔗 내 링크</div>${linkSection}</div></div>
        ${inLanding
          ? `<div class="my-row" style="background:var(--green-bg)">
               <div><div class="my-row-label" style="color:var(--green)">착륙 시간이에요!</div><div class="my-row-sub">모든 품앗이 완료 후 눌러주세요 · 1회만 가능</div></div>
               <button class="btn btn-green btn-sm" data-action="land">착륙 ✓</button>
             </div>`
          : waitingLand
            ? `<div class="my-row" style="background:#FFFBEB">
                 <div><div class="my-row-label" style="color:var(--amber)">⏳ 착륙 대기 중</div>
                 <div class="my-row-sub">착륙 시작: ${currentRoom.land_start_fmt||fmt(currentRoom.land_start)}</div></div>
               </div>`
            : `<div class="my-row"><div class="my-row-sub">착륙 시간이 되면 착륙 버튼이 나타납니다</div></div>`}
      </div>`;
    return;
  }

  // ── 미참여 — 티켓팅 시작 전
  if (beforeTicket) {
    el.innerHTML = `
      <div class="my-block">
        <div class="my-row" style="background:#F5F5F5">
          <div><div class="my-row-label" style="color:var(--text3)">⏳ 티켓팅 시작 전</div>
          <div class="my-row-sub">${currentRoom.ticket_start_fmt||fmt(currentRoom.ticket_start)} 부터 참여 가능</div></div>
        </div>
      </div>`;
    return;
  }

  // ── 미참여 — 티켓팅 중 (경고 보유 시)
  if (inTicketing && me?.is_warned) {
    el.innerHTML = `
      <div class="my-block">
        <div style="padding:16px;background:var(--red-bg);border-radius:var(--radius-sm)">
          <div class="my-row-label" style="color:var(--red)">🚫 경고 보유 중 — 탑승 불가</div>
          <div class="my-row-sub" style="margin-top:6px">만료: ${me.warn_expires||'익일 10:00'} 이전에 경고를 차감해야 탑승 가능합니다</div>
        </div>
      </div>`;
    return;
  }

  // ── 미참여 — 티켓팅 중 (정상)
  if (inTicketing) {
    const ec = me?.excellent_count || 0;
    const hc = me?.honorary_count  || 0;
    const passCount = weekLandCount >= 2
      ? `<span style="color:var(--green);font-weight:700">✅ 이번주 ${weekLandCount}회 완료 (필참 달성)</span>`
      : `<span style="color:var(--amber);font-weight:700">⚠ 이번주 ${weekLandCount}회 완료 (${2-weekLandCount}회 더 필요)</span>`;
    el.innerHTML = `
      <div class="my-block">
        <div style="padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border)">
          <div style="font-size:12px">🛫 일반 탑승 · 주 2회 필참 &nbsp;|&nbsp; ${passCount}</div>
        </div>
        <div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
          <div>
            <div class="my-row-label" style="margin-bottom:6px">인스타그램 링크</div>
            <input class="input" id="inp-ticket-link" placeholder="https://instagram.com/p/..." style="font-size:13px" autocomplete="off">
          </div>
          <div>
            <div class="my-row-label" style="margin-bottom:6px">탑승 유형</div>
            <select class="input" id="sel-ticket-type" style="font-size:13px">
              <option value="normal">✈ 일반 탑승 — 주 2회 필참 카운트</option>
              ${ec > 0 ? `<option value="excellent">⭐ 우수 탑승 (${ec}개 보유) — 주 2회 카운트 제외</option>` : ''}
              ${hc > 0 ? `<option value="honorary">🏅 명예 탑승 (${hc}개 보유) — 주 2회 카운트 제외</option>` : ''}
            </select>
          </div>
          <button class="btn btn-grad" data-action="ticket" style="padding:12px">
            ✈ 탑승하기 &nbsp;·&nbsp; 이번주 ${weekLandCount}회 완료
          </button>
          <button class="btn btn-outline btn-sm" style="color:#6B7280;border-color:#D1D5DB" data-action="staff">
            🎖 운영진 탑승 (주 2회 카운트 제외)
          </button>
          <div class="my-row-sub">취소 불가 · 우수/명예/운영진은 즉시 착륙 완료 처리</div>
        </div>
      </div>`;
    return;
  }

  // ── 미참여 — 티켓팅 마감 이후
  el.innerHTML = `
    <div class="my-block">
      <div class="my-row" style="background:#F5F5F5">
        <div class="my-row-label" style="color:var(--text3)">🔒 티켓팅이 마감되었습니다</div>
      </div>
    </div>`;
}

// =====================================================================
// 액션 함수들
// =====================================================================

// 탑승 유형 select에서 탑승
async function doTicketFromUI() {
  const sel = document.getElementById('sel-ticket-type');
  await doTicket(sel ? sel.value : 'normal');
}

// 운영진 탑승
async function doTicketDirect(ticket_type) {
  const li = document.getElementById('inp-ticket-link');
  if (!li?.value.trim().startsWith('http')) { alert('인스타그램 링크를 먼저 입력해 주세요'); li?.focus(); return; }
  await doTicket(ticket_type);
}

// 티켓팅 공통
async function doTicket(ticket_type='normal') {
  if (!me) me = loadSession();
  if (!me?.member_id) { alert('세션이 만료되었습니다. 다시 로그인해 주세요.'); clearSession(); me=null; showPage('page-login'); return; }
  if (!currentRoom) return;

  const li = document.getElementById('inp-ticket-link');
  const post_url = li?.value.trim() || '';
  if (!post_url.startsWith('http')) { alert('인스타그램 링크를 먼저 입력해 주세요'); li?.focus(); return; }

  const btn = document.querySelector('#my-part button[data-action="ticket"]');
  if (btn) { btn.disabled=true; btn.textContent='처리 중...'; }
  try {
    const ticketData = await api('ticket', {
      room_id: currentRoom.room_id, member_id: String(me.member_id),
      nickname: me.nickname, insta_id: me.insta_id, ticket_type,
    });
    if (!ticketData.ok) { alert(ticketData.error||'탑승 실패'); if(btn){btn.disabled=false;btn.textContent='✈ 탑승하기';} return; }

    await api('register_link', {room_id:currentRoom.room_id, member_id:String(me.member_id), post_url});

    if (ticket_type==='excellent'){ me.excellent_count=Math.max(0,(me.excellent_count||0)-1); saveSession(me); }
    if (ticket_type==='honorary') { me.honorary_count =Math.max(0,(me.honorary_count ||0)-1); saveSession(me); }

    flyEffect();
    await goTicket(currentRoom.room_id);
  } catch(e) {
    console.error('doTicket:', e); alert('서버 오류가 발생했습니다');
    if (btn){ btn.disabled=false; btn.textContent='✈ 탑승하기'; }
  }
}

// 링크 등록
async function doRegisterLink(btn) {
  const url = (document.getElementById('inp-link')?.value||'').trim();
  if (!url.startsWith('http')) { alert('올바른 URL을 입력해 주세요'); return; }
  if (btn) { btn.disabled=true; btn.textContent='등록 중...'; }
  try {
    const data = await api('register_link', {room_id:currentRoom.room_id, member_id:me.member_id, post_url:url});
    if (!data.ok) { alert(data.error||'링크 등록 실패'); if(btn){btn.disabled=false;btn.textContent='등록';} return; }
    await goTicket(currentRoom.room_id);
  } catch(e) { alert('서버 오류'); if(btn){btn.disabled=false;btn.textContent='등록';} }
}

// 링크 수정
async function doUpdateLink(btn) {
  const url = (document.getElementById('inp-link-edit')?.value||'').trim();
  if (!url.startsWith('http')) { alert('올바른 URL을 입력해 주세요'); return; }
  if (btn) { btn.disabled=true; btn.textContent='수정 중...'; }
  try {
    const data = await api('update_link', {room_id:currentRoom.room_id, member_id:me.member_id, post_url:url});
    if (!data.ok) { alert(data.error||'링크 수정 실패'); if(btn){btn.disabled=false;btn.textContent='수정';} return; }
    await goTicket(currentRoom.room_id);
  } catch(e) { alert('서버 오류'); if(btn){btn.disabled=false;btn.textContent='수정';} }
}

// 착륙
async function doLand(btn) {
  if (!confirm('착륙 완료 처리하시겠습니까? 1회만 가능합니다.')) return;
  if (btn) { btn.disabled=true; btn.textContent='처리 중...'; }
  try {
    const data = await api('land', {room_id:currentRoom.room_id, member_id:me.member_id});
    if (!data.ok) { alert(data.error||'착륙 실패'); if(btn){btn.disabled=false;btn.textContent='착륙 ✓';} return; }
    await goTicket(currentRoom.room_id);
  } catch(e) { alert('서버 오류'); if(btn){btn.disabled=false;btn.textContent='착륙 ✓';} }
}

// 전체 복사
function copyAll() {
  if (!participants.length) { alert('참여자가 없습니다'); return; }
  const text = participants.map(p=>`${p.nickname} @${p.insta_id}${p.post_url?' '+p.post_url:''}`).join('\n');
  navigator.clipboard.writeText(text)
    .then(()=>alert(`${participants.length}명 복사 완료!`))
    .catch(()=>{ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); alert(`${participants.length}명 복사 완료!`); });
}
